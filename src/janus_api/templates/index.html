<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Log Viewer</title>
    <style>
      :root{
        --debug: #06b6d4;
        --info: #10b981;
        --warning: #f59e0b;
        --error: #ef4444;
        --critical: #9f1239;
        --unknown: #9ca3af;
        font-family: Inter, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial;
      }
      body{margin:0;background:#0f172a;color:#e6eef8}
      .app{display:flex;flex-direction:column;height:100vh}
      header{display:flex;justify-content:space-between;align-items:center;padding:12px 16px;background:#020617;border-bottom:1px solid rgba(255,255,255,0.03)}
      .controls select,.controls input{margin-left:8px}
      main{flex:1;overflow:hidden;padding:12px}
      .log-list{height:100%;overflow:auto;background:#031027;border-radius:6px;padding:8px}
      table{width:100%;border-collapse:collapse}
      th{text-align:left;padding:6px 8px;color:#9fb3d6;font-size:12px;position:sticky;top:0;background:linear-gradient(transparent, rgba(0,0,0,0.08))}
      td{padding:6px 8px;border-bottom:1px solid rgba(255,255,255,0.02);vertical-align:top;font-size:13px}
      .ts{width:170px;color:#9fb3d6}
      .level{width:90px;font-weight:700}
      .logger{width:220px;color:#c0d7f0}
      .msg pre{margin:0;white-space:pre-wrap;color:#e6eef8}
      tr{background:transparent;border-radius:4px;margin-bottom:6px}
      footer{padding:8px 12px;background:#020617;color:#9fb3d6;font-size:13px}
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module">
      import React from "https://cdn.skypack.dev/react@18.2.0";
      import { createRoot } from "https://cdn.skypack.dev/react-dom@18.2.0/client";
      import App from "./App.jsx"; // serve this file from same folder via dev server
      createRoot(document.getElementById("root")).render(React.createElement(App));
    </script>
  </body>
</html>
